<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Tavrena">
<style>
  .t{transform-box:view-box;opacity:0;animation:drop .5s cubic-bezier(.2,.9,.25,1.2) forwards}
  .t1{transform-origin:31px 31px;animation-delay:0s}
  .t2{transform-origin:85px 31px;animation-delay:.12s}
  .t3{transform-origin:31px 85px;animation-delay:.24s}
  .t4{transform-origin:88px 88px;fill:#0A0A0D;animation:drop4 .5s cubic-bezier(.2,.9,.25,1.2) .36s forwards,pull .55s cubic-bezier(.3,1.5,.4,1) .95s forwards}
  @keyframes drop{0%{opacity:0;transform:translateY(-18px) scale(.4)}100%{opacity:1;transform:none}}
  @keyframes drop4{0%{opacity:0;transform:translate(-5px,-23px) scale(.4)}100%{opacity:1;transform:translate(-5px,-5px)}}
  @keyframes pull{0%{opacity:1;transform:translate(-5px,-5px) rotate(0);fill:#0A0A0D}100%{opacity:1;transform:rotate(12deg);fill:#8116E0}}
  @media (prefers-reduced-motion:reduce){.t,.t4{animation:none;opacity:1}.t4{transform:rotate(12deg);fill:#8116E0}}
</style>
<rect class="t t1" x="8" y="8" width="46" height="46" rx="12" fill="#0A0A0D"/>
<rect class="t t2" x="62" y="8" width="46" height="46" rx="12" fill="#0A0A0D"/>
<rect class="t t3" x="8" y="62" width="46" height="46" rx="12" fill="#0A0A0D"/>
<rect class="t t4" x="66" y="66" width="44" height="44" rx="12"/>
</svg>

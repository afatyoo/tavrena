<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavrena | Super Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-role="admin">
<div class="app">
  <aside class="sidebar glass" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-top glass"><a class="brand" href="index.html" style="font-size:1.3rem"><img src="assets/logo-mark.svg" alt="">tavrena<b>.</b></a><span class="icon-btn"><i class="bi bi-bell"></i><span class="dot"></span></span></div>
    <div class="topbar">
      <div class="glass greet flex-grow-1" id="greet"></div>
      <div class="glass d-none d-md-flex align-items-center gap-2"><i class="bi bi-search text-muted"></i><input class="border-0 bg-transparent" style="outline:none" placeholder="Cari tiket..."></div>
      <div class="glass d-none d-lg-flex align-items-center gap-2"><span class="icon-btn"><i class="bi bi-bell"></i><span class="dot"></span></span><span class="icon-btn"><i class="bi bi-calendar3"></i></span></div>
    </div>
    <section class="glass overview">
      <h6 class="fw-bold mb-0">Ringkasan Platform</h6><p class="text-muted small mb-3">User, agent, dan tiket di semua tim</p>
      <div class="row g-3"><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">232 <small>(20 baru)</small></div><div class="lbl">Total User</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">12 <small>(2 baru)</small></div><div class="lbl">Total Agent</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">86 <small></small></div><div class="lbl">Total Tiket</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">3 <small></small></div><div class="lbl">Manager</div></div></div></div>
    </section>
    <div class="row g-3">
      <div class="col-xl-8"><div class="glass p-3 h-100">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-2">
          <h6 class="fw-bold mb-0">Kelola User</h6>
          <div class="d-flex gap-2"><input id="s" class="form-control form-control-sm" placeholder="Cari nama / email" oninput="draw()" style="width:180px">
          <select id="fr" class="form-select form-select-sm" style="width:auto" onchange="draw()"><option value="">Semua role</option><option>Super Admin</option><option>Manager</option><option>Agent</option><option>User</option></select>
          <button class="btn btn-tv btn-sm px-3" data-bs-toggle="modal" data-bs-target="#addU"><i class="bi bi-person-plus"></i></button></div>
        </div>
        <div class="table-responsive"><table class="table tv-table mb-0"><thead><tr><th>Nama</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
      </div></div>
      <div class="col-xl-4"><div class="glass p-3 h-100">
        <h6 class="fw-bold">Role & Permission</h6>
        <table class="table table-sm tv-table small mb-0 text-center"><thead><tr><th class="text-start">Aksi</th><th>SA</th><th>MGR</th><th>AGT</th></tr></thead><tbody id="perm"></tbody></table>
      </div></div>
    </div>
    <div class="row g-3">
      <div class="col-md-4"><div class="glass stat"><div class="d-flex justify-content-between"><div class="num">24</div><span class="sev sev-High">High</span></div><div class="lbl">Tiket High belum selesai</div></div></div>
      <div class="col-md-4"><div class="glass stat"><div class="d-flex justify-content-between"><div class="num">36</div><span class="sev sev-Medium">Medium</span></div><div class="lbl">Tiket Medium</div></div></div>
      <div class="col-md-4"><div class="glass stat"><div class="d-flex justify-content-between"><div class="num">26</div><span class="sev sev-Low">Low</span></div><div class="lbl">Tiket Low</div></div></div>
    </div>
<div class="modal fade" id="addU"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 p-2">
  <div class="modal-header border-0"><h5 class="fw-bold mb-0">Tambah User</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body"><input class="form-control mb-2" placeholder="Nama"><input class="form-control mb-2" placeholder="Email">
  <select class="form-select mb-3"><option>Agent</option><option>Manager</option><option>Super Admin</option></select>
  <button class="btn btn-tv w-100 py-2" data-bs-dismiss="modal">Simpan & Kirim Undangan</button></div></div></div></div>
  </main>
</div>
<nav class="bottom-nav glass" id="bottomnav"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script>
const USERS=[["Afatyo","afatyo@tavrena.id","Super Admin",1],["Rina Putri","rina@tavrena.id","Manager",1],["Iman Abadi","iman@tavrena.id","Agent",1],["Bagas Pratama","bagas@tavrena.id","Agent",1],["Sinta Dewi","sinta@tavrena.id","Agent",0],["Andi Wijaya","andi@mail.com","User",1],["Maya Sari","maya@mail.com","User",0]];
const RC={"Super Admin":"#D0FF00","Manager":"#A855F7","Agent":"#FFB020","User":"#9a99a8"};
function draw(){
  const q=s.value.toLowerCase();
  tb.innerHTML=USERS.filter(u=>(!fr.value||u[2]===fr.value)&&(u[0]+u[1]).toLowerCase().includes(q)).map(u=>`<tr><td><div class="d-flex align-items-center gap-2"><span class="avatar" style="background:${RC[u[2]]};color:#0A0A0D">${initials(u[0])}</span><div><div class="fw-semibold">${u[0]}</div><div class="small text-muted">${u[1]}</div></div></div></td>
  <td><span class="role-chip" style="color:${RC[u[2]]};background:${RC[u[2]]}1f">${u[2]}</span></td>
  <td>${u[3]?'<span class="st st-Complete">Terverifikasi</span>':'<span class="st st-Pending">Menunggu link</span>'}</td>
  <td class="text-end"><button class="btn btn-sm btn-light"><i class="bi bi-pencil"></i></button> <button class="btn btn-sm btn-light text-danger"><i class="bi bi-trash"></i></button></td></tr>`).join("")||'<tr><td colspan="4" class="text-center text-muted py-4">Tidak ada user</td></tr>';
}
draw();
const P=[["Kelola user & role",1,0,0],["Assign tiket",1,1,0],["Ubah status tiket",1,1,2],["Hapus tiket",1,1,0],["Lihat laporan",1,1,2]];
const ic=v=>v===1?'<i class="bi bi-check-circle-fill text-success"></i>':v===2?'<i class="bi bi-check-circle text-warning" title="Hanya tiket miliknya"></i>':'<i class="bi bi-x-circle text-danger"></i>';
perm.innerHTML=P.map(p=>`<tr><td class="text-start">${p[0]}</td><td>${ic(p[1])}</td><td>${ic(p[2])}</td><td>${ic(p[3])}</td></tr>`).join("")+'<tr><td colspan="4" class="text-start text-muted mock-note pt-2"><i class="bi bi-check-circle text-warning"></i> = hanya tiket miliknya</td></tr>';
</script>
</body>
</html>

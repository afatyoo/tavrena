<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavrena | Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="background:#FEFFFC">
<div class="glass overflow-hidden w-100" style="max-width:1000px;border-color:#0A0A0D;box-shadow:10px 10px 0 #8116E0">
  <div class="row g-0">
    <div class="col-md-6 d-none d-md-flex flex-column justify-content-center p-5 text-white position-relative overflow-hidden" style="background:#8116E0;min-height:520px">
      <div class="position-relative">
        <div class="brand mb-5" style="color:#FEFFFC"><img src="assets/logo-mark-white-animated.svg" alt="" style="width:42px;height:42px"><span class="brand-word">Tavrena</span></div><div style="font-size:3.6rem;font-weight:800;letter-spacing:-.05em;line-height:.92">Buka tiket.<br><span style="color:#D0FF00">Tutup</span> masalah.</div>
        
        <p class="mt-4" style="max-width:320px;font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:#E6CCFF">Kirim laporan, cek statusnya, dan balas pesan agent tanpa pindah aplikasi.</p>
      </div>
    </div>
    <div class="col-md-6 p-4 p-lg-5 position-relative">
      <a class="brand d-md-none mb-3" href="index.html"><img src="assets/logo-mark-animated.svg" alt=""><span class="brand-word">tavrena</span></a>
      <div class="mb-2" style="font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.14em;color:#8D8C99">01 / AKSES AKUN</div><h3 class="mb-1" style="font-size:2.4rem;font-weight:800;letter-spacing:-.04em">Masuk</h3>
      <p class="text-muted small mb-4">Gunakan email yang sudah dikonfirmasi lewat link verifikasi.</p>
      <form onsubmit="event.preventDefault();doLogin()">
        <div class="input-group mb-3"><span class="input-group-text border-0" style="background:#F2F2EC"><i class="bi bi-envelope"></i></span><input id="email" class="form-control border-0" style="background:#F2F2EC" placeholder="Email"></div>
        <div class="input-group mb-1"><span class="input-group-text border-0" style="background:#F2F2EC"><i class="bi bi-lock"></i></span><input id="pw" type="password" class="form-control border-0" style="background:#F2F2EC" placeholder="Password"><button type="button" class="btn border-0 small fw-semibold" style="background:#F2F2EC;color:#8116E0" onclick="pw.type=pw.type==='password'?'text':'password'">SHOW</button></div>
        <div id="err" class="text-danger small mb-2" style="min-height:20px"></div>
        <div class="d-flex justify-content-between small mb-4"><label><input type="checkbox" class="form-check-input me-1">Ingat saya</label><a href="#">Lupa password?</a></div>
        <label class="small text-muted mb-1">Masuk sebagai (mockup)</label>
        <select id="role" class="form-select mb-3"><option value="user.html">User</option><option value="staff.html">Agent</option><option value="manager.html">Manager</option><option value="admin.html">Super Admin</option></select>
        <button class="btn btn-tv w-100 py-2 mb-2">Masuk</button>
        <div class="text-center text-muted small my-2">atau</div>
        <button type="button" class="btn btn-light w-100 py-2 fw-semibold" data-bs-toggle="modal" data-bs-target="#reg">Buat akun baru</button>
      </form>
      <p class="text-center small text-muted mt-4 mb-0">Belum punya akun? <a href="#" data-bs-toggle="modal" data-bs-target="#reg">Daftar</a></p>
    </div>
  </div>
</div>
<div class="modal fade" id="reg"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 p-2">
  <div class="modal-header border-0"><h5 class="fw-bold mb-0">Buat Akun</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="regBody">
    <input class="form-control mb-2" placeholder="Nama lengkap"><input class="form-control mb-2" placeholder="Email"><input type="password" class="form-control mb-3" placeholder="Password (min. 8 karakter)">
    <button class="btn btn-tv w-100 py-2" onclick="regBody.innerHTML=`<div class='text-center py-3'><i class='bi bi-envelope-check' style='color:#8116E0' style='font-size:3rem'></i><h6 class='fw-bold mt-2'>Cek email kamu</h6><p class='small text-muted'>Kami mengirim link konfirmasi. Akun aktif setelah link diklik.</p></div>`">Daftar</button>
  </div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/data.js"></script>

<script>
function doLogin(){
  const e=email.value.trim(),p=pw.value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){err.textContent="Format email tidak valid";return}
  if(p.length<8){err.textContent="Password minimal 8 karakter";return}
  location.href=role.value;
}
</script>
</body>
</html>

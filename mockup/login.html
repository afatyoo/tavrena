<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavrena | Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="background:#0A0A0D">
<div class="glass overflow-hidden w-100" style="max-width:960px;border-radius:28px">
  <div class="row g-0">
    <div class="col-md-6 d-none d-md-flex flex-column justify-content-center p-5 text-white position-relative overflow-hidden" style="background:#8116E0;min-height:520px">
      <div class="position-absolute rounded-circle" style="width:260px;height:260px;left:-80px;bottom:-90px;background:#6a0fbd"></div>
      <div class="position-absolute rounded-circle" style="width:180px;height:180px;right:40px;bottom:40px;background:#D0FF00"></div>
      <div class="position-relative">
        <img src="assets/logo.svg" alt="Tavrena" style="height:44px" class="mb-4"><div class="fw-bold" style="font-size:2.6rem;letter-spacing:-1px;line-height:1">Selamat<br>datang</div>
        <div class="fw-semibold mb-3 mt-2" style="color:#D0FF00">Helpdesk ticketing Tavrena</div>
        <p class="small opacity-75" style="max-width:300px">Kirim laporan, cek statusnya, dan balas pesan agent tanpa pindah aplikasi.</p>
      </div>
    </div>
    <div class="col-md-6 p-4 p-lg-5 position-relative">
      <a class="brand d-md-none mb-3" href="index.html"><img src="assets/logo-mark.svg" alt="">tavrena<b>.</b></a>
      <h3 class="fw-bold mb-1">Masuk</h3>
      <p class="text-muted small mb-4">Gunakan email yang sudah dikonfirmasi lewat link verifikasi.</p>
      <form onsubmit="event.preventDefault();doLogin()">
        <div class="input-group mb-3"><span class="input-group-text border-0" style="background:rgba(255,255,255,.06)"><i class="bi bi-envelope"></i></span><input id="email" class="form-control border-0" style="background:rgba(255,255,255,.06)" placeholder="Email"></div>
        <div class="input-group mb-1"><span class="input-group-text border-0" style="background:rgba(255,255,255,.06)"><i class="bi bi-lock"></i></span><input id="pw" type="password" class="form-control border-0" style="background:rgba(255,255,255,.06)" placeholder="Password"><button type="button" class="btn border-0 small fw-semibold" style="background:rgba(255,255,255,.06);color:#D0FF00" onclick="pw.type=pw.type==='password'?'text':'password'">SHOW</button></div>
        <div id="err" class="text-danger small mb-2" style="min-height:20px"></div>
        <div class="d-flex justify-content-between small mb-4"><label><input type="checkbox" class="form-check-input me-1">Ingat saya</label><a href="#">Lupa password?</a></div>
        <label class="small text-muted mb-1">Masuk sebagai (mockup)</label>
        <select id="role" class="form-select mb-3"><option value="user.html">User</option><option value="staff.html">Agent</option><option value="manager.html">Manager</option><option value="admin.html">Super Admin</option></select>
        <button class="btn btn-tv w-100 py-2 mb-2">Masuk</button>
        <div class="text-center text-muted small my-2">atau</div>
        <button type="button" class="btn btn-outline-light w-100 py-2 fw-semibold" style="border-radius:999px" data-bs-toggle="modal" data-bs-target="#reg">Buat akun baru</button>
      </form>
      <p class="text-center small text-muted mt-4 mb-0">Belum punya akun? <a href="#" data-bs-toggle="modal" data-bs-target="#reg">Daftar</a></p>
    </div>
  </div>
</div>
<div class="modal fade" id="reg"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 p-2">
  <div class="modal-header border-0"><h5 class="fw-bold mb-0">Buat Akun</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="regBody">
    <input class="form-control mb-2" placeholder="Nama lengkap"><input class="form-control mb-2" placeholder="Email"><input type="password" class="form-control mb-3" placeholder="Password (min. 8 karakter)">
    <button class="btn btn-tv w-100 py-2" onclick="regBody.innerHTML=`<div class='text-center py-3'><i class='bi bi-envelope-check' style='color:#D0FF00' style='font-size:3rem'></i><h6 class='fw-bold mt-2'>Cek email kamu</h6><p class='small text-muted'>Kami mengirim link konfirmasi. Akun aktif setelah link diklik.</p></div>`">Daftar</button>
  </div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/data.js"></script>

<script>
function doLogin(){
  const e=email.value.trim(),p=pw.value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){err.textContent="Format email tidak valid";return}
  if(p.length<8){err.textContent="Password minimal 8 karakter";return}
  location.href=role.value;
}
</script>
</body>
</html>

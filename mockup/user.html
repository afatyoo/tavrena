<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tavrena | Tiket Saya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="assets/style.css" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-role="user">
<div class="app">
  <aside class="sidebar glass" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-top glass"><a class="brand" href="index.html" style="font-size:1.3rem"><img src="assets/logo-mark-animated.svg" alt=""><span class="brand-word">tavrena</span></a><span class="icon-btn"><i class="bi bi-bell"></i><span class="dot"></span></span></div>
    <div class="topbar">
      <div class="glass greet flex-grow-1" id="greet"></div>
      <div class="glass d-none d-md-flex align-items-center gap-2"><i class="bi bi-search text-muted"></i><input class="border-0 bg-transparent" style="outline:none" placeholder="Cari tiket..."></div>
      <div class="glass d-none d-lg-flex align-items-center gap-2"><span class="icon-btn"><i class="bi bi-bell"></i><span class="dot"></span></span><span class="icon-btn"><i class="bi bi-calendar3"></i></span></div>
    </div>
    <section class="glass overview">
      <h6 class="fw-bold mb-0">Tiket Saya</h6><p class="text-muted small mb-3">Status semua laporan yang kamu kirim</p>
      <div class="row g-3"><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">3 <small></small></div><div class="lbl">Tiket Open</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">1 <small></small></div><div class="lbl">Pending</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">2 <small></small></div><div class="lbl">Selesai</div></div></div><div class="col-6 col-lg-3"><div class="glass stat"><div class="num">6 <small></small></div><div class="lbl">Total Tiket</div></div></div></div>
    </section>
    <div class="row g-3">
      <div class="col-lg-5">
        <div class="glass p-3 h-100">
          <div class="d-flex justify-content-between align-items-center mb-3"><h6 class="fw-bold mb-0">Daftar Tiket</h6><button class="btn btn-tv btn-sm px-3" data-bs-toggle="modal" data-bs-target="#newT"><i class="bi bi-plus"></i> Buat Tiket</button></div>
          <div class="btn-group btn-group-sm mb-3 w-100" id="tabs"></div>
          <div id="list" class="d-flex flex-column gap-2"></div>
        </div>
      </div>
      <div class="col-lg-7">      <div class="glass p-3 p-lg-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
          <div><div class="text-muted small">#1024 · dibuat 15 menit lalu oleh Andi Wijaya</div><h6 class="fw-bold mb-1">Tidak bisa login ke email kantor</h6>
          <span class="sev sev-High">High</span> <span class="st st-Open ms-1">Open</span></div>
          <span class="small text-muted"><i class="bi bi-person-badge"></i> Ditangani: Iman Abadi</span>
        </div>
        <div class="chat mb-3" id="chat"></div>
        <div class="d-flex gap-2"><input class="form-control" placeholder="Tulis balasan..."><button class="btn btn-tv px-3"><i class="bi bi-send"></i></button></div>
      </div></div>
    </div>
<div class="modal fade" id="newT"><div class="modal-dialog modal-dialog-centered"><div class="modal-content rounded-4 p-2">
  <div class="modal-header border-0"><h5 class="fw-bold mb-0">Buat Tiket Baru</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <label class="small fw-semibold">Judul</label><input class="form-control mb-2" placeholder="Contoh: Tidak bisa login email">
    <label class="small fw-semibold">Severity</label><select class="form-select mb-2"><option>Low</option><option>Medium</option><option>High</option></select>
    <label class="small fw-semibold">Deskripsi</label><textarea class="form-control mb-2" rows="4" placeholder="Jelaskan kendalanya..."></textarea>
    <label class="small fw-semibold">Lampiran</label><input type="file" class="form-control mb-3">
    <button class="btn btn-tv w-100 py-2" data-bs-dismiss="modal">Kirim Tiket</button>
  </div></div></div></div>
  </main>
</div>
<nav class="bottom-nav glass" id="bottomnav"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/layout.js"></script>
<script>
const MY=TICKETS.filter(t=>t.user==="Andi Wijaya"||t.id>=1022).slice(0,6);
let tab="Semua";
function draw(){
  tabs.innerHTML=["Semua","Open","Pending","Complete"].map(s=>`<button class="btn ${s===tab?'btn-tv':'btn-light'}" onclick="tab='${s}';draw()">${s}</button>`).join("");
  const rows=MY.filter(t=>tab==="Semua"||t.status===tab);
  list.innerHTML=rows.length?rows.map((t,i)=>`<div class="p-3 rounded-3 ${i===0?'bg-white shadow-sm':''}" style="cursor:pointer">
    <div class="d-flex justify-content-between"><span class="small text-muted">#${t.id}</span>${stBadge(t.status)}</div>
    <div class="fw-semibold my-1">${t.title}</div><div class="d-flex justify-content-between small">${sevBadge(t.severity)}<span class="text-muted">${t.age} lalu</span></div></div>`).join(""):'<p class="text-muted small text-center py-4">Tidak ada tiket</p>';
}
draw();renderChat(chat);
</script>
</body>
</html>

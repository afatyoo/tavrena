<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <title>Tavrena | Daftar</title>
</head>
<body class="d-flex align-items-center justify-content-center p-3" style="min-height:100vh">
<div class="glass overflow-hidden w-100" style="max-width:1000px;border-color:var(--dark);box-shadow:10px 10px 0 var(--violet)">
  <div class="row g-0">
    <div class="col-md-6 d-none d-md-flex flex-column justify-content-center p-5" style="background:var(--violet);min-height:540px">
      <div class="brand mb-5" style="color:var(--white)"><img src="assets/img/logo-mark-white-animated.svg" alt="" width="42" height="42"><span class="brand-word">Tavrena</span></div>
      <div style="font-size:3.4rem;font-weight:800;letter-spacing:-.05em;line-height:.92;color:var(--white)">Satu akun.<br><span style="color:var(--lime)">Semua</span> tiket.</div>
      <p class="mt-4" style="max-width:320px;font-family:var(--mono);font-size:.8rem;color:#E6CCFF">Setelah daftar, kami kirim link konfirmasi ke email kamu. Akun aktif setelah link itu diklik.</p>
    </div>
    <div class="col-md-6 p-4 p-lg-5">
      <a class="brand d-md-none mb-3" href="index.html"><img src="assets/img/logo-mark-animated.svg" alt=""><span class="brand-word">tavrena</span></a>
      <h1 class="mb-1" style="font-size:2.4rem;font-weight:800;letter-spacing:-.04em">Buat akun</h1>
      <p class="text-muted small mb-4">Isi data di bawah untuk mulai membuat tiket.</p>
      <div id="formAlert" class="mb-3"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label small fw-semibold">Nama lengkap</label>
          <input id="name" name="name" class="form-control field" placeholder="Nama sesuai identitas" autocomplete="name">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold">Email</label>
          <input id="email" name="email" type="email" class="form-control field" placeholder="nama@perusahaan.com" autocomplete="email">
          <div class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small fw-semibold">Password</label>
          <div class="input-group has-validation">
            <input id="password" name="password" type="password" class="form-control field" placeholder="Minimal 8 karakter, ada huruf dan angka" autocomplete="new-password">
            <button type="button" class="btn field small fw-semibold" style="color:var(--violet)" data-toggle-password="password">LIHAT</button>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="mb-4">
          <label for="confirm" class="form-label small fw-semibold">Ulangi password</label>
          <input id="confirm" name="confirm" type="password" class="form-control field" autocomplete="new-password">
          <div class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-tv w-100 py-2 mb-3">Daftar</button>
      </form>
      <p class="text-center small text-muted mb-0">Sudah punya akun? <a href="index.html">Masuk</a></p>
    </div>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validator.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>

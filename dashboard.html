<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <title>Tavrena | Dashboard</title>
</head>
<body>
<div class="app">
  <aside class="sidebar glass" id="sidebar"></aside>
  <main class="main">
    <div class="mobile-top glass">
      <a class="brand" href="dashboard.html"><img src="assets/img/logo-mark-animated.svg" alt=""><span class="brand-word">tavrena</span></a>
      <a class="icon-btn" href="#" data-logout title="Keluar"><i class="bi bi-box-arrow-right"></i></a>
    </div>
    <div class="topbar">
      <div class="glass greet flex-grow-1" id="greet"></div>
      <div class="glass d-none d-md-flex align-items-center gap-2"><i class="bi bi-search text-muted"></i><input id="search" class="border-0 bg-transparent" style="outline:none" placeholder="Cari tiket..."></div>
    </div>
    <section class="glass overview">
      <h2 class="h6 fw-bold mb-0">Ringkasan Tiket</h2>
      <p class="text-muted small mb-3">Jumlah tiket per status</p>
      <div class="row g-3">
        <div class="col-6 col-lg-3"><div class="glass stat"><div class="num" id="statTotal">0</div><div class="lbl">Total Tiket</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat"><div class="num" id="statOpen">0</div><div class="lbl">Open</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat"><div class="num" id="statPending">0</div><div class="lbl">Pending</div></div></div>
        <div class="col-6 col-lg-3"><div class="glass stat"><div class="num" id="statComplete">0</div><div class="lbl">Complete</div></div></div>
      </div>
    </section>
    <section class="glass p-3">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h6 fw-bold mb-0">Tiket Terbaru</h2>
        <a href="tickets.html" class="small">Lihat semua</a>
      </div>
      <div id="ticketList"><div class="empty">Belum ada tiket</div></div>
    </section>
  </main>
</div>
<nav class="bottom-nav glass" id="bottomnav"></nav>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/validator.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
